services:
  vibe:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibe-agent:local          # stable local tag (avoids anonymous rebuilds)
    container_name: vibe-agent
    working_dir: ${CONTAINER_WORK_DIR:-/workspace}
    stdin_open: true
    tty: true
    restart: unless-stopped

    # Default to the image's "node" user (uid 1000). Override via UID/GID in .env
    # if you need host-user ownership of bind-mounted files (common on Linux).
    # On Docker Desktop (macOS/Windows) uid 1000 is usually fine.
    user: "${UID:-1000}:${GID:-1000}"

    env_file:
      - .env

    environment:
      # Make host reachable from the container (macOS/Windows Docker Desktop works out of the box)
      # Linux users: the extra_hosts line below is required
      HOST_GATEWAY: host.docker.internal

      # IntelliJ MCP
      IDEA_MCP_URL: http://${IDEA_MCP_HOST:-host.docker.internal}:${IDEA_MCP_PORT:-64342}/sse
      IDEA_MCP_STREAM_URL: http://${IDEA_MCP_HOST:-host.docker.internal}:${IDEA_MCP_PORT:-64342}/stream
      IDEA_MCP_HEADERS: '{"IJ_MCP_SERVER_PROJECT_PATH":"${IDEA_MCP_PROJECT_PATH}"}'

      # VSCode MCP Server (Semantic Workbench Team) – SSE endpoint
      VSCODE_MCP_URL: http://${VSCODE_MCP_HOST:-host.docker.internal}:${VSCODE_MCP_PORT:-6010}/sse
      VSCODE_MCP_STREAM_URL: http://${VSCODE_MCP_HOST:-host.docker.internal}:${VSCODE_MCP_PORT:-6010}/sse

      # Common LLM env names (agents auto-detect many of these)
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      HETZNER_API_KEY: ${HETZNER_API_KEY:-}
      HETZNER_API_BASE_URL: ${HETZNER_API_BASE_URL:-https://inference.hetzner.com/api/v1}

      # Convenience
      WORKDIR: ${CONTAINER_WORK_DIR:-/workspace}

      # Important: use the real home of the "node" user
      HOME: /home/node
      npm_config_cache: /home/node/.npm

    volumes:
      # Project (writable) – the main safety boundary
      - ${HOST_PROJECT_DIR}:${CONTAINER_WORK_DIR:-/workspace}:rw

      # Mount what you need to the home of the "node" user (read-only) to avoid accidental writes to the host.
      - ./.vibe-home/.bash_profile:/home/node/.bash_profile:ro

      # SSH keys (read-only) – for git push / ssh
      - ${HOST_SSH_DIR}:/home/node/.ssh:ro

      # Reuse host Oh My Zsh (host paths take precedence)
      - ${HOST_OH_MY_ZSH}:/home/node/.oh-my-zsh:ro
      - ${HOST_ZSHRC}:/home/node/.zshrc:ro

      # Caches (host paths; create them on the host if missing)
      - ${HOST_NPM_CACHE}:/home/node/.npm:rw
      # - ${HOST_PNPM_STORE}:/home/node/.local/share/pnpm/store:rw
      - ${HOST_GRADLE_DIR}:/home/node/.gradle:rw
      - ${HOST_M2_DIR}:/home/node/.m2:rw

      # OpenCode persistence (survive image rebuild / container recreate)
      # auth.json + sessions/conversations live under share; global config under config;
      # state (model prefs, prompt history) under state; package cache under cache.
      # Only the opencode *subdir* is mounted — parents (.cache, .config, .local/…)
      # stay image-owned (created as node in the Dockerfile) so oh-my-zsh and other
      # tools can still write siblings like ~/.cache/oh-my-zsh.
      - ./.vibe-home/opencode/config:/home/node/.config/opencode:rw
      - ./.vibe-home/opencode/share:/home/node/.local/share/opencode:rw
      - ./.vibe-home/opencode/state:/home/node/.local/state/opencode:rw
      - ./.vibe-home/opencode/cache:/home/node/.cache/opencode:rw

    extra_hosts:
      # Required on Linux; harmless on Docker Desktop (macOS/Windows)
      - "host.docker.internal:host-gateway"

    # Optional resource limits
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
